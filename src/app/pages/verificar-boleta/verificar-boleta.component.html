<section class="verify">
  <h1>Verifica tu stiker</h1>
  <p>
    Ingresa tu número de cédula para consultar los stikers asociados a tu compra.
  </p>

  <form (submit)="buscarStikers($event)">
    <input
      type="text"
      placeholder="Número de cédula"
      [(ngModel)]="cedula"
      name="cedula"
      required
    >

    <button type="submit" [disabled]="buscando">
      {{ buscando ? 'Buscando...' : 'Buscar stikers' }}
    </button>
  </form>

  <p class="error-msg" *ngIf="error">{{ error }}</p>

  <!-- Resultado -->
  <div class="resultado" *ngIf="stikers.length > 0">
    <h2>Stikers encontrados</h2>

    <div class="stiker" *ngFor="let b of stikers">
      <p><strong>Stiker:</strong> {{ b.codigo }}</p>
      <p><strong>Números:</strong> {{ b.numero1 }} - {{ b.numero2 }}</p>
      <p><strong>Estado:</strong>
        <span [class.pagado]="b.pagado">
          {{ b.pagado ? 'Pagado' : 'Pendiente' }}
        </span>
      </p>
    </div>
  </div>
</section>
